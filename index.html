<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PersonaAI — מערכת סיווג שיחות</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── TOP BAR ─────────────────────────────────────────────────── */
  .topbar {
    background: #fff;
    border-bottom: 1px solid #e0e0e0;
    padding: 0 2rem;
    height: 52px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .topbar-logo {
    width: 28px; height: 28px;
    background: #2563eb;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
  }
  .topbar-logo svg { width: 16px; height: 16px; fill: #fff; }
  .topbar h1 { font-size: 16px; font-weight: 600; color: #1a1a1a; }

  /* ── MAIN LAYOUT ────────────────────────────────────────────── */
  .layout {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 1rem;
    padding: 1rem 1.5rem;
    flex: 1;
    max-width: 1100px;
    margin: 0 auto;
    width: 100%;
  }

  /* ── PANELS ────────────────────────────────────────────────── */
  .panel {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    padding: 14px 18px;
    font-size: 15px;
    font-weight: 600;
    color: #1a1a1a;
    border-bottom: 1px solid #e8e8e8;
    text-align: center;
  }

  /* ── CHAT PANEL ────────────────────────────────────────────── */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 420px;
    max-height: 560px;
  }

  /* User bubble */
  .msg-user {
    background: #f5f5f5;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    color: #222;
    align-self: flex-end;
    max-width: 85%;
    text-align: right;
  }
  .msg-user .msg-label {
    font-size: 11px;
    color: #888;
    margin-bottom: 4px;
  }

  /* Bot analysis card */
  .msg-bot {
    background: #fafafa;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    overflow: hidden;
    font-size: 13px;
    align-self: flex-start;
    width: 100%;
  }
  .msg-bot-header {
    background: #f0f4ff;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 600;
    color: #2563eb;
    border-bottom: 1px solid #dde6fb;
    text-align: center;
  }

  .analysis-section {
    padding: 10px 14px;
    border-bottom: 1px solid #efefef;
  }
  .analysis-section:last-child { border-bottom: none; }
  .analysis-title {
    font-size: 12px;
    font-weight: 700;
    color: #333;
    margin-bottom: 6px;
  }
  .analysis-row {
    display: flex;
    gap: 6px;
    align-items: center;
    font-size: 13px;
    margin-bottom: 3px;
  }
  .analysis-row .label { color: #555; }
  .analysis-row .value { font-weight: 600; }
  .value.anger  { color: #dc2626; }
  .value.fear   { color: #7c3aed; }
  .value.disgust{ color: #b45309; }
  .value.sadness{ color: #1d4ed8; }
  .value.joy    { color: #16a34a; }
  .value.surprise{color: #0891b2; }
  .value.neutral{ color: #555;    }
  .value.default{ color: #333;    }

  .conf-bar-wrap { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
  .conf-bar {
    flex: 1; height: 5px; background: #e5e7eb; border-radius: 99px; overflow: hidden;
  }
  .conf-bar-fill { height: 100%; border-radius: 99px; background: #2563eb; }
  .conf-pct { font-size: 11px; color: #888; min-width: 30px; text-align: left; }

  /* Template chip */
  .template-chip {
    display: inline-block;
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    color: #1d4ed8;
    font-weight: 500;
    direction: ltr;
  }
  .state-chip {
    display: inline-block;
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 11px;
    color: #15803d;
  }

  /* Feedback section */
  .feedback-section { background: #f9f9f9; }
  .feedback-title { font-size: 12px; font-weight: 700; color: #333; margin-bottom: 8px; }
  .radio-group { display: flex; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
  .radio-group label {
    display: flex; align-items: center; gap: 4px;
    font-size: 12px; color: #444; cursor: pointer;
  }
  .radio-group input[type=radio] { accent-color: #2563eb; cursor: pointer; }
  .stars { display: flex; gap: 3px; direction: ltr; }
  .star {
    font-size: 18px; cursor: pointer; color: #d1d5db; transition: color 0.15s;
    user-select: none;
  }
  .star.active { color: #f59e0b; }
  .stars-label { font-size: 12px; color: #555; margin-left: 6px; display: flex; align-items: center; }

  /* ── INPUT BAR ─────────────────────────────────────────────── */
  .input-bar {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid #e8e8e8;
    align-items: center;
  }
  .input-bar input {
    flex: 1;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 14px;
    direction: rtl;
    outline: none;
    background: #fafafa;
    transition: border 0.15s;
    color: #111;
  }
  .input-bar input:focus { border-color: #2563eb; background: #fff; }
  .input-bar input::placeholder { color: #aaa; }
  .send-btn {
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .send-btn:hover { background: #1d4ed8; }
  .send-btn:disabled { background: #93c5fd; cursor: not-allowed; }

  /* ── HISTORY PANEL ─────────────────────────────────────────── */
  .history-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .history-item {
    border: 1px solid #e8e8e8;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .history-item:hover { border-color: #93c5fd; }
  .history-item.active { border-color: #2563eb; }
  .history-item-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: #fafafa;
    border-bottom: 1px solid #f0f0f0;
  }
  .history-item-header .turn-num { font-size: 13px; font-weight: 600; color: #222; }
  .history-item-header .turn-time { font-size: 11px; color: #999; }
  .history-item-tags {
    padding: 6px 12px;
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
  }
  .tag {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 99px;
  }
  .tag.anger   { background: #fee2e2; color: #b91c1c; }
  .tag.fear    { background: #ede9fe; color: #6d28d9; }
  .tag.disgust { background: #fef3c7; color: #92400e; }
  .tag.sadness { background: #dbeafe; color: #1e40af; }
  .tag.joy     { background: #dcfce7; color: #166534; }
  .tag.surprise{ background: #cffafe; color: #0e7490; }
  .tag.neutral { background: #f3f4f6; color: #374151; }
  .tag.intent  { background: #eff6ff; color: #1d4ed8; }

  .history-footer {
    padding: 12px;
    border-top: 1px solid #e8e8e8;
  }
  .history-footer-btn {
    width: 100%;
    border: 1px solid #2563eb;
    background: #fff;
    color: #2563eb;
    border-radius: 8px;
    padding: 9px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .history-footer-btn:hover { background: #eff6ff; }

  /* ── LOADING SPINNER ───────────────────────────────────────── */
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid #e5e7eb;
    border-top-color: #2563eb;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .thinking-row {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 16px;
    font-size: 13px;
    color: #888;
  }

  /* ── EMPTY STATE ───────────────────────────────────────────── */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: #bbb;
    font-size: 13px;
    padding: 2rem;
    text-align: center;
  }
  .empty-icon { font-size: 32px; }

  /* ── API CONFIG BANNER ─────────────────────────────────────── */
  .config-bar {
    background: #fffbeb;
    border-bottom: 1px solid #fde68a;
    padding: 8px 1.5rem;
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 13px;
    color: #92400e;
  }
  .config-bar input {
    flex: 1;
    max-width: 320px;
    border: 1px solid #fcd34d;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 13px;
    background: #fff;
    color: #111;
    direction: ltr;
    outline: none;
  }
  .config-bar input:focus { border-color: #f59e0b; }
  .api-save-btn {
    background: #f59e0b; color: #fff; border: none;
    border-radius: 6px; padding: 4px 14px; font-size: 13px;
    cursor: pointer; font-weight: 600;
  }
  .api-save-btn:hover { background: #d97706; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-logo">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
  </div>
  <h1>PersonaAI — מערכת סיווג שיחות</h1>
</div>

<!-- API CONFIG BAR -->
<div class="config-bar" id="configBar">
  <span>כתובת שרת:</span>
  <input type="text" id="apiUrl" value="http://localhost:8000" placeholder="http://localhost:8000" />
  <button class="api-save-btn" onclick="saveApiUrl()">שמור</button>
  <span id="apiStatus" style="color:#888"></span>
</div>

<!-- MAIN LAYOUT -->
<div class="layout">

  <!-- LEFT: CHAT PANEL -->
  <div class="panel">
    <div class="panel-header">חלון שיחה</div>

    <div class="chat-messages" id="chatMessages">
      <div class="empty-state">
        <div class="empty-icon">💬</div>
        <div>הקלד הודעה כדי להתחיל שיחה</div>
      </div>
    </div>

    <div class="input-bar">
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">שלח</button>
      <input type="text" id="messageInput" placeholder="הקלד הודעה כאן..."
             onkeydown="if(event.key==='Enter') sendMessage()" />
    </div>
  </div>

  <!-- RIGHT: HISTORY PANEL -->
  <div class="panel">
    <div class="panel-header">היסטוריית סיווגים</div>

    <div class="history-list" id="historyList">
      <div class="empty-state">
        <div>אין סיווגים עדיין</div>
      </div>
    </div>

    <div class="history-footer">
      <button class="history-footer-btn" onclick="exportHistory()">
        <span>📋</span>
        <span>לכל היסטוריית הסיווגים</span>
      </button>
    </div>
  </div>

</div>

<script>
// ── STATE ──────────────────────────────────────────────────────────────────
let API_BASE = localStorage.getItem('chatbot_api_url') || 'http://localhost:8000';
let sessionId = null;
let turnCounter = 0;
let historyData = [];
let feedbackMap = {};  // turnIndex → { radio, stars }

document.getElementById('apiUrl').value = API_BASE;

function saveApiUrl() {
  API_BASE = document.getElementById('apiUrl').value.trim().replace(/\/$/, '');
  localStorage.setItem('chatbot_api_url', API_BASE);
  document.getElementById('apiStatus').textContent = '✓ נשמר';
  setTimeout(() => document.getElementById('apiStatus').textContent = '', 2000);
}

// ── SEND MESSAGE ────────────────────────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('messageInput');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  document.getElementById('sendBtn').disabled = true;

  // Clear empty state
  const chatEl = document.getElementById('chatMessages');
  const empty = chatEl.querySelector('.empty-state');
  if (empty) empty.remove();

  // Render user bubble
  appendUserMessage(text);

  // Show thinking indicator
  const thinkingId = 'thinking-' + Date.now();
  chatEl.insertAdjacentHTML('beforeend', `
    <div id="${thinkingId}" class="thinking-row">
      <div class="spinner"></div>
      <span>מנתח...</span>
    </div>
  `);
  chatEl.scrollTop = chatEl.scrollHeight;

  try {
    const payload = { message: text };
    if (sessionId) payload.session_id = sessionId;

    const res = await fetch(`${API_BASE}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    document.getElementById(thinkingId)?.remove();

    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: 'שגיאה לא ידועה' }));
      throw new Error(err.detail || `HTTP ${res.status}`);
    }

    const data = await res.json();
    sessionId = data.session_id;
    turnCounter++;
    const turnIdx = turnCounter;

    // Render bot analysis card
    appendBotAnalysis(data, turnIdx);

    // Add to history panel
    addToHistory(data, turnIdx, text);

    // Store for export
    historyData.push({ turn: turnIdx, message: text, ...data });

  } catch (e) {
    document.getElementById(thinkingId)?.remove();
    appendErrorMessage(e.message);
  }

  document.getElementById('sendBtn').disabled = false;
  input.focus();
  chatEl.scrollTop = chatEl.scrollHeight;
}

// ── RENDER USER BUBBLE ──────────────────────────────────────────────────────
function appendUserMessage(text) {
  const chatEl = document.getElementById('chatMessages');
  chatEl.insertAdjacentHTML('beforeend', `
    <div class="msg-user">
      <div class="msg-label">[משתמש]:</div>
      ${escHtml(text)}
    </div>
  `);
}

// ── RENDER BOT ANALYSIS CARD ────────────────────────────────────────────────
function appendBotAnalysis(data, turnIdx) {
  const chatEl = document.getElementById('chatMessages');
  const emotionClass = data.emotion || 'neutral';
  const intentConf = Math.round((data.intent_conf || 0) * 100);
  const emotionConf = Math.round((data.emotion_conf || 0) * 100);

  const emotionHe = translateEmotion(data.emotion);
  const intentHe  = translateIntent(data.intent);

  chatEl.insertAdjacentHTML('beforeend', `
    <div class="msg-bot" id="bot-${turnIdx}">
      <div class="msg-bot-header">[מערכת - PersonaAI]:</div>

      <!-- Internal analysis -->
      <div class="analysis-section">
        <div class="analysis-title">ניתוח פנימי:</div>
        <div class="analysis-row">
          <span class="label">• רגש:</span>
          <span class="value ${emotionClass}">${emotionHe} (${data.emotion})</span>
        </div>
        <div class="conf-bar-wrap" style="margin-right:12px; margin-bottom:4px;">
          <div class="conf-bar"><div class="conf-bar-fill" style="width:${emotionConf}%; background:${emotionColor(data.emotion)}"></div></div>
          <span class="conf-pct">${emotionConf}%</span>
        </div>
        <div class="analysis-row">
          <span class="label">• כוונה:</span>
          <span class="value default">${intentHe} (${data.intent})</span>
        </div>
        <div class="conf-bar-wrap" style="margin-right:12px;">
          <div class="conf-bar"><div class="conf-bar-fill" style="width:${intentConf}%"></div></div>
          <span class="conf-pct">${intentConf}%</span>
        </div>
      </div>

      <!-- Selected template -->
      <div class="analysis-section">
        <div class="analysis-title">תבנית תגובה שנבחרה:</div>
        <div style="margin-top:4px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          <span class="template-chip">${data.action}</span>
          <span style="font-size:11px; color:#888">${data.prev_state} → <span class="state-chip">${data.next_state}</span></span>
        </div>
      </div>

      <!-- System feedback -->
      <div class="analysis-section feedback-section">
        <div class="analysis-title">משוב למערכת:</div>
        <div class="radio-group" id="radio-${turnIdx}">
          <label><input type="radio" name="fb-${turnIdx}" value="correct" onchange="saveFeedback(${turnIdx})" /> צדק</label>
          <label><input type="radio" name="fb-${turnIdx}" value="wrong_intent" onchange="saveFeedback(${turnIdx})" /> טעה בכוונה</label>
          <label><input type="radio" name="fb-${turnIdx}" value="wrong_emotion" onchange="saveFeedback(${turnIdx})" /> טעה ברגש</label>
        </div>
        <div style="display:flex; align-items:center; gap:4px;">
          <span style="font-size:12px; color:#555;">דירוג טבנית:</span>
          <div class="stars" id="stars-${turnIdx}">
            ${[1,2,3,4,5].map(i => `<span class="star" data-val="${i}" onclick="setStar(${turnIdx}, ${i})">★</span>`).join('')}
          </div>
        </div>
      </div>
    </div>
  `);
}

function appendErrorMessage(msg) {
  const chatEl = document.getElementById('chatMessages');
  chatEl.insertAdjacentHTML('beforeend', `
    <div style="background:#fef2f2; border:1px solid #fca5a5; border-radius:8px; padding:10px 14px; font-size:13px; color:#b91c1c;">
      ❌ שגיאה: ${escHtml(msg)}
    </div>
  `);
}

// ── FEEDBACK ────────────────────────────────────────────────────────────────
function saveFeedback(turnIdx) {
  const selected = document.querySelector(`input[name="fb-${turnIdx}"]:checked`);
  if (!feedbackMap[turnIdx]) feedbackMap[turnIdx] = {};
  feedbackMap[turnIdx].radio = selected ? selected.value : null;
  updateHistoryItem(turnIdx);
}

function setStar(turnIdx, val) {
  if (!feedbackMap[turnIdx]) feedbackMap[turnIdx] = {};
  feedbackMap[turnIdx].stars = val;
  const starsEl = document.getElementById(`stars-${turnIdx}`);
  if (!starsEl) return;
  starsEl.querySelectorAll('.star').forEach(s => {
    s.classList.toggle('active', parseInt(s.dataset.val) <= val);
  });
  updateHistoryItem(turnIdx);
}

// ── HISTORY ─────────────────────────────────────────────────────────────────
function addToHistory(data, turnIdx, userText) {
  const histEl = document.getElementById('historyList');
  const empty = histEl.querySelector('.empty-state');
  if (empty) empty.remove();

  const now = new Date();
  const timeStr = now.toLocaleTimeString('he-IL', { hour:'2-digit', minute:'2-digit' });
  const emotionHe = translateEmotion(data.emotion);

  histEl.insertAdjacentHTML('afterbegin', `
    <div class="history-item" id="hist-${turnIdx}" onclick="scrollToTurn(${turnIdx})">
      <div class="history-item-header">
        <span class="turn-num">#${turnIdx} (עכשיו)</span>
        <span class="turn-time">${timeStr}</span>
      </div>
      <div class="history-item-tags" id="hist-tags-${turnIdx}">
        <span class="tag ${data.emotion}">${emotionHe}</span>
        <span class="tag intent">${translateIntent(data.intent)}</span>
      </div>
    </div>
  `);
}

function updateHistoryItem(turnIdx) {
  const fb = feedbackMap[turnIdx];
  if (!fb) return;
  const tagsEl = document.getElementById(`hist-tags-${turnIdx}`);
  if (!tagsEl) return;
  const existing = tagsEl.querySelectorAll('.tag.feedback');
  existing.forEach(e => e.remove());

  if (fb.radio) {
    const labels = { correct:'✓ צדק', wrong_intent:'✗ כוונה', wrong_emotion:'✗ רגש' };
    const colors = { correct:'background:#dcfce7;color:#166534', wrong_intent:'background:#fee2e2;color:#991b1b', wrong_emotion:'background:#fef3c7;color:#92400e' };
    tagsEl.insertAdjacentHTML('beforeend', `
      <span class="tag feedback" style="${colors[fb.radio]}">${labels[fb.radio]}</span>
    `);
  }
  if (fb.stars) {
    tagsEl.insertAdjacentHTML('beforeend', `
      <span class="tag feedback" style="background:#fef9c3;color:#854d0e">${'★'.repeat(fb.stars)}</span>
    `);
  }
}

function scrollToTurn(turnIdx) {
  const el = document.getElementById(`bot-${turnIdx}`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  document.querySelectorAll('.history-item').forEach(i => i.classList.remove('active'));
  document.getElementById(`hist-${turnIdx}`)?.classList.add('active');
}

// ── EXPORT ──────────────────────────────────────────────────────────────────
function exportHistory() {
  const rows = historyData.map(d => ({
    turn: d.turn,
    message: d.message,
    emotion: d.emotion,
    emotion_conf: d.emotion_conf,
    intent: d.intent,
    intent_conf: d.intent_conf,
    action: d.action,
    prev_state: d.prev_state,
    next_state: d.next_state,
    feedback_radio: feedbackMap[d.turn]?.radio || '',
    feedback_stars: feedbackMap[d.turn]?.stars || ''
  }));

  const csv = [
    Object.keys(rows[0] || {}).join(','),
    ...rows.map(r => Object.values(r).map(v => `"${String(v).replace(/"/g,'""')}"`).join(','))
  ].join('\n');

  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `classification_history_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

// ── HELPERS ─────────────────────────────────────────────────────────────────
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function translateEmotion(e) {
  const m = { anger:'כעס', fear:'פחד', disgust:'גועל', sadness:'עצב', joy:'שמחה', surprise:'הפתעה', neutral:'ניטרלי' };
  return m[e] || e;
}

function translateIntent(i) {
  const m = { question:'שאלה', request:'בקשה', statement:'הצהרה', general:'כללי' };
  return m[i] || i;
}

function emotionColor(e) {
  const m = { anger:'#dc2626', fear:'#7c3aed', disgust:'#b45309', sadness:'#1d4ed8', joy:'#16a34a', surprise:'#0891b2', neutral:'#6b7280' };
  return m[e] || '#2563eb';
}
