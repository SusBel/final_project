<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PersonaAI — Conversation Classifier</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    background: #fff;
    border-bottom: 1px solid #e0e0e0;
    padding: 0 2rem;
    height: 52px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .topbar-logo {
    width: 28px; height: 28px;
    background: #2563eb;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
  }
  .topbar-logo svg { width: 16px; height: 16px; fill: #fff; }
  .topbar h1 { font-size: 16px; font-weight: 600; color: #1a1a1a; }

  .layout {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 1rem;
    padding: 1rem 1.5rem;
    flex: 1;
    max-width: 1100px;
    margin: 0 auto;
    width: 100%;
  }

  .panel {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    padding: 14px 18px;
    font-size: 15px;
    font-weight: 600;
    color: #1a1a1a;
    border-bottom: 1px solid #e8e8e8;
    text-align: center;
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 420px;
    max-height: 560px;
  }

  .msg-user {
    background: #f5f5f5;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    color: #222;
    align-self: flex-end;
    max-width: 85%;
    flex-shrink: 0;
  }
  .msg-user .msg-label {
    font-size: 11px;
    color: #888;
    margin-bottom: 4px;
  }

  .msg-bot {
    background: #fafafa;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    overflow: hidden;
    font-size: 13px;
    align-self: flex-start;
    width: 100%;
    flex-shrink: 0;
  }
  .msg-bot-header {
    background: #f0f4ff;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 600;
    color: #2563eb;
    border-bottom: 1px solid #dde6fb;
    text-align: center;
  }

  .analysis-section {
    padding: 10px 14px;
    border-bottom: 1px solid #efefef;
  }
  .analysis-section:last-child { border-bottom: none; }
  .analysis-title {
    font-size: 12px;
    font-weight: 700;
    color: #333;
    margin-bottom: 6px;
  }
  .analysis-row {
    display: flex;
    gap: 6px;
    align-items: center;
    font-size: 13px;
    margin-bottom: 3px;
  }
  .analysis-row .label { color: #555; }
  .analysis-row .value { font-weight: 600; }
  .value.anger   { color: #dc2626; }
  .value.fear    { color: #7c3aed; }
  .value.disgust { color: #b45309; }
  .value.sadness { color: #1d4ed8; }
  .value.joy     { color: #16a34a; }
  .value.surprise{ color: #0891b2; }
  .value.neutral { color: #555; }
  .value.default { color: #333; }

  .conf-bar-wrap { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
  .conf-bar { flex: 1; height: 5px; background: #e5e7eb; border-radius: 99px; overflow: hidden; }
  .conf-bar-fill { height: 100%; border-radius: 99px; background: #2563eb; }
  .conf-pct { font-size: 11px; color: #888; min-width: 30px; }

  .template-chip {
    display: inline-block;
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    color: #1d4ed8;
    font-weight: 500;
    font-family: monospace;
  }
  .state-chip {
    display: inline-block;
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 11px;
    color: #15803d;
    font-family: monospace;
  }
  .state-prev-chip {
    display: inline-block;
    background: #f3f4f6;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 11px;
    color: #374151;
    font-family: monospace;
  }

  .feedback-section { background: #f9f9f9; }
  .radio-group { display: flex; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
  .radio-group label {
    display: flex; align-items: center; gap: 4px;
    font-size: 12px; color: #444; cursor: pointer;
  }
  .radio-group input[type=checkbox] { accent-color: #2563eb; cursor: pointer; }
  .stars { display: flex; gap: 3px; }
  .star { font-size: 18px; cursor: pointer; color: #d1d5db; transition: color 0.15s; user-select: none; }
  .star.active { color: #f59e0b; }

  .input-bar {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid #e8e8e8;
    align-items: center;
  }
  .input-bar input {
    flex: 1;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 14px;
    outline: none;
    background: #fafafa;
    transition: border 0.15s;
    color: #111;
  }
  .input-bar input:focus { border-color: #2563eb; background: #fff; }
  .input-bar input::placeholder { color: #aaa; }
  .send-btn {
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .send-btn:hover { background: #1d4ed8; }
  .send-btn:disabled { background: #93c5fd; cursor: not-allowed; }

  .history-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .history-item {
    border: 1px solid #e8e8e8;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s;
    background: #fff;
  }
  .history-item:hover { border-color: #93c5fd; }
  .history-item.active { border-color: #2563eb; background: #f8fafc; }
  .history-item-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
  }
  .history-item-header .turn-num { font-size: 13px; font-weight: 600; color: #222; }
  .history-item-header .turn-time { font-size: 11px; color: #999; }

  .history-footer { padding: 12px; border-top: 1px solid #e8e8e8; }
  .history-footer-btn {
    width: 100%;
    border: 1px solid #2563eb;
    background: #fff;
    color: #2563eb;
    border-radius: 8px;
    padding: 9px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: inherit;
  }
  .history-footer-btn:hover { background: #eff6ff; }

  .spinner {
    width: 18px; height: 18px;
    border: 2px solid #e5e7eb;
    border-top-color: #2563eb;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .thinking-row {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 16px; font-size: 13px; color: #888;
  }

  .empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px; color: #bbb; font-size: 13px;
    padding: 2rem; text-align: center;
  }
  .empty-icon { font-size: 32px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg-user, .msg-bot { animation: fadeIn 0.2s ease; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
  </div>
  <h1>PersonaAI — Conversation Classifier</h1>
</div>

<div class="layout">

  <div class="panel">
    <div class="panel-header">Chat Window</div>

    <div class="chat-messages" id="chatMessages">
      <div class="empty-state">
        <div class="empty-icon">💬</div>
        <div>Type a message to start the conversation</div>
      </div>
    </div>

    <div class="input-bar">
      <input type="text" id="messageInput" placeholder="Type your message here..."
             onkeydown="if(event.key==='Enter') sendMessage()" />
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">Chat History</div>

    <div class="history-list" id="historyList">
      <div class="empty-state">
        <div>No chat history yet</div>
      </div>
    </div>

    <div class="history-footer">
      <button class="history-footer-btn" onclick="startNewChat()">
        <span>➕</span>
        <span>Start New Chat</span>
      </button>
    </div>
  </div>

</div>

<script>
const API_BASE = 'http://localhost:8000';
let activeSessionId = null;
let chatSessions = [];

function startNewChat() {
  if (activeSessionId) {
    const session = chatSessions.find(s => s.id === activeSessionId);
    if (session) session.html = document.getElementById('chatMessages').innerHTML;
  }
  activeSessionId = null;
  document.getElementById('chatMessages').innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">💬</div>
      <div>Type a message to start the conversation</div>
    </div>
  `;
  renderSidebar();
}

async function sendMessage() {
  const input = document.getElementById('messageInput');
  const text  = input.value.trim();
  if (!text) return;

  input.value = '';
  document.getElementById('sendBtn').disabled = true;

  const chatEl = document.getElementById('chatMessages');
  chatEl.querySelector('.empty-state')?.remove();

  appendUserMessage(text);

  const thinkingId = 'thinking-' + Date.now();
  chatEl.insertAdjacentHTML('beforeend', `
    <div id="${thinkingId}" class="thinking-row">
      <div class="spinner"></div>
      <span>Analyzing...</span>
    </div>
  `);
  chatEl.scrollTop = chatEl.scrollHeight;

  try {
    const payload = { message: text };
    if (activeSessionId) payload.session_id = activeSessionId;

    const res = await fetch(`${API_BASE}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    document.getElementById(thinkingId)?.remove();

    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: 'Unknown error' }));
      throw new Error(err.detail || `HTTP ${res.status}`);
    }

    const data = await res.json();
    const isNewSession = !activeSessionId;
    activeSessionId = data.session_id;

    if (isNewSession) {
      chatSessions.unshift({
        id: activeSessionId,
        title: text.length > 25 ? text.substring(0, 25) + '...' : text,
        time: new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' }),
        html: ''
      });
    }

    appendBotAnalysis(data, Date.now());

    const session = chatSessions.find(s => s.id === activeSessionId);
    if (session) session.html = document.getElementById('chatMessages').innerHTML;

    renderSidebar();

  } catch (e) {
    document.getElementById(thinkingId)?.remove();
    chatEl.insertAdjacentHTML('beforeend', `
      <div style="background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;padding:10px 14px;font-size:13px;color:#b91c1c;">
        ❌ Error: ${escHtml(e.message)}
      </div>
    `);
  }

  document.getElementById('sendBtn').disabled = false;
  input.focus();
  document.getElementById('chatMessages').scrollTop = 99999;
}

function loadChat(id) {
  if (activeSessionId) {
    const currentSession = chatSessions.find(s => s.id === activeSessionId);
    if (currentSession) currentSession.html = document.getElementById('chatMessages').innerHTML;
  }
  const targetSession = chatSessions.find(s => s.id === id);
  if (!targetSession) return;
  activeSessionId = id;
  document.getElementById('chatMessages').innerHTML = targetSession.html;
  renderSidebar();
  document.getElementById('chatMessages').scrollTop = 99999;
}

function renderSidebar() {
  const list = document.getElementById('historyList');
  if (chatSessions.length === 0) {
    list.innerHTML = `<div class="empty-state"><div>No chat history yet</div></div>`;
    return;
  }
  list.innerHTML = chatSessions.map(s => `
    <div class="history-item ${s.id === activeSessionId ? 'active' : ''}" onclick="loadChat('${s.id}')">
      <div class="history-item-header">
        <span class="turn-num">${escHtml(s.title)}</span>
        <span class="turn-time">${s.time}</span>
      </div>
    </div>
  `).join('');
}

function appendUserMessage(text) {
  document.getElementById('chatMessages').insertAdjacentHTML('beforeend', `
    <div class="msg-user">
      <div class="msg-label">[User]:</div>
      ${escHtml(text)}
    </div>
  `);
}

function appendBotAnalysis(data, turnIdx) {
  const emotionConf = Math.round((data.emotion_conf || 0) * 100);
  const intentConf  = Math.round((data.intent_conf  || 0) * 100);
  const eColor      = emotionColor(data.emotion);

  document.getElementById('chatMessages').insertAdjacentHTML('beforeend', `
    <div class="msg-bot" id="bot-${turnIdx}">
      <div class="msg-bot-header">[System — PersonaAI]:</div>

      <div class="analysis-section">
        <div class="analysis-title">Internal Analysis:</div>
        <div class="analysis-row">
          <span class="label">• Emotion:</span>
          <span class="value ${data.emotion}">${capitalize(data.emotion)}</span>
        </div>
        <div class="conf-bar-wrap" style="margin-left:12px;margin-bottom:4px;">
          <div class="conf-bar"><div class="conf-bar-fill" style="width:${emotionConf}%;background:${eColor}"></div></div>
          <span class="conf-pct">${emotionConf}%</span>
        </div>
        <div class="analysis-row">
          <span class="label">• Intent:</span>
          <span class="value default">${capitalize(data.intent)}</span>
        </div>
        <div class="conf-bar-wrap" style="margin-left:12px;">
          <div class="conf-bar"><div class="conf-bar-fill" style="width:${intentConf}%"></div></div>
          <span class="conf-pct">${intentConf}%</span>
        </div>
      </div>

      <div class="analysis-section">
        <div class="analysis-title">Selected Response Template:</div>
        <div style="margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <span class="template-chip">${data.action}</span>
          <span style="font-size:11px;color:#888;display:flex;align-items:center;gap:4px;">
            <span class="state-prev-chip">${data.prev_state}</span>
            →
            <span class="state-chip">${data.next_state}</span>
          </span>
        </div>
      </div>

      <div class="analysis-section feedback-section">
        <div class="analysis-title">System Feedback:</div>
        <div class="radio-group">
          <label><input type="checkbox" onchange="this.toggleAttribute('checked', this.checked)" /> Correct</label>
          <label><input type="checkbox" onchange="this.toggleAttribute('checked', this.checked)" /> Wrong intent</label>
          <label><input type="checkbox" onchange="this.toggleAttribute('checked', this.checked)" /> Wrong emotion</label>
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
          <span style="font-size:12px;color:#555;">Template rating:</span>
          <div class="stars">
            ${[1,2,3,4,5].map(i=>`<span class="star" data-val="${i}" onclick="setStar(this.parentElement, ${i})">★</span>`).join('')}
          </div>
        </div>
      </div>
    </div>
  `);
}

function setStar(container, val) {
  container.querySelectorAll('.star').forEach(s => {
    const isActive = parseInt(s.dataset.val) <= val;
    s.classList.toggle('active', isActive);
  });
  const session = chatSessions.find(s => s.id === activeSessionId);
  if (session) session.html = document.getElementById('chatMessages').innerHTML;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function capitalize(s) {
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
}
function emotionColor(e) {
  return { anger:'#dc2626', fear:'#7c3aed', disgust:'#b45309',
           sadness:'#1d4ed8', joy:'#16a34a', surprise:'#0891b2',
           neutral:'#6b7280' }[e] || '#2563eb';
}
</script>
</body>
</html>
