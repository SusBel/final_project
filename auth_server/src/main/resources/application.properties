# ─── Server ────────────────────────────────────────────────────────────────────
# Auth server runs on port 8080 (PersonaAI Python backend is on port 8000)
server.port=8080

# ─── MySQL Database ─────────────────────────────────────────────────────────────
# Update these credentials to match your MySQL installation
spring.datasource.url=jdbc:mysql://localhost:3308/personaai_auth?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=yaronsql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ────────────────────────────────────────────────────────────
# 'validate' in production — Hibernate checks schema matches entities but does NOT modify it.
# Use 'create' on first run if you don't run schema.sql manually.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Run schema.sql on startup to create tables if they do not exist
spring.sql.init.mode=never
# Set to 'always' on first run, then change back to 'never'
# spring.sql.init.mode=always

# ─── Logging ─────────────────────────────────────────────────────────────────────
logging.level.com.personaai=INFO
logging.level.org.springframework.web=WARN

# ─── PersonaAI Python App URL ────────────────────────────────────────────────────
# After a successful login the browser is redirected here
personaai.app.url=http://localhost:8000/index.html